<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Chốt Đơn Live — Cài đặt</title>
  <style>
    :root {
      --bg: #F0F4F8; --surface: #FFFFFF; --border: #CBD5E1; --text: #0F172A; --muted: #475569;
      --primary: #4F46E5; --primary-h: #4338CA; --ok-bg: #ECFDF5; --ok: #047857; --err-bg: #FEF2F2; --err: #B91C1C;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0B1120; --surface: #131B2E; --border: #334155; --text: #F1F5F9; --muted: #A3B1C6;
        --primary: #6366F1; --primary-h: #818CF8; --ok-bg: #052E1C; --ok: #6EE7B7; --err-bg: #3B1219; --err: #FCA5A5;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; }
    main { max-width: 540px; margin: 0 auto; padding: 24px 20px 40px; display: flex; flex-direction: column; gap: 18px; }
    h1 { font-size: 22px; margin: 0; }
    p { margin: 0; color: var(--muted); line-height: 1.5; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .step { font-weight: 700; font-size: 16px; }
    label { font-weight: 600; font-size: 14px; }
    input, select {
      width: 100%; font: inherit; font-size: 15px; color: var(--text); background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; min-height: 44px;
    }
    input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.25); }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .row > select, .row > input { flex: 1; min-width: 200px; }
    button {
      font: inherit; font-weight: 600; border-radius: 8px; padding: 10px 16px; min-height: 44px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
    }
    button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    button.primary:hover:not(:disabled) { background: var(--primary-h); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .msg { padding: 10px 12px; border-radius: 8px; font-size: 14px; line-height: 1.45; }
    .msg.ok { background: var(--ok-bg); color: var(--ok); }
    .msg.err { background: var(--err-bg); color: var(--err); }
    .msg:empty { display: none; }
    small { color: var(--muted); }
    .actions { display: flex; justify-content: flex-end; gap: 8px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div>
      <h1 id="title">Chào mừng đến Chốt Đơn Live</h1>
      <p id="intro">Cài đặt 1 lần cho máy này. Sau đó bạn đăng nhập (hoặc đăng ký bằng mã mời) ngay trong app.</p>
    </div>

    <form id="form" class="card" novalidate>
      <div class="step">1. Máy in nhiệt</div>
      <label for="printer">Chọn máy in đã cài trong Windows</label>
      <div class="row">
        <select id="printer"></select>
        <button type="button" id="reloadPrinters">Làm mới</button>
      </div>
      <small>Không thấy máy in? Cắm USB, bật máy in, cài driver rồi bấm "Làm mới". Có thể để trống và chọn sau.</small>

      <div class="step">2. Địa chỉ dịch vụ</div>
      <div id="urlFixed" hidden>
        <p>Đang dùng: <b id="urlFixedText"></b> <button type="button" id="changeUrl" style="min-height:32px;padding:4px 10px;margin-left:6px">Đổi</button></p>
      </div>
      <div id="urlEdit">
        <label for="url">Địa chỉ do người cung cấp dịch vụ gửi cho bạn</label>
        <div class="row">
          <input id="url" type="url" inputmode="url" spellcheck="false" autocomplete="off" placeholder="https://chotdon.vercel.app" />
          <button type="button" id="test">Kiểm tra</button>
        </div>
      </div>
      <div id="testMsg" class="msg" role="status" aria-live="polite"></div>

      <div id="saveMsg" class="msg" role="alert"></div>
      <div class="actions">
        <button type="submit" class="primary" id="save" disabled>Lưu và mở app</button>
      </div>
    </form>
  </main>
  <script src="setup.js"></script>
</body>
</html>
