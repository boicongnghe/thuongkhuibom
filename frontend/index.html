<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Chốt Đơn Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo">
        <span class="logo-icon">🛒</span>
        <span class="logo-text">Chốt Đơn Live</span>
      </div>
      <div class="tiktok-badge" id="tiktokBadge">
        <span class="badge-dot"></span>
        <span class="badge-text">Chưa kết nối</span>
      </div>
    </div>
    <div class="header-right">
      <div class="connect-form">
        <input type="text" id="usernameInput" placeholder="@tiktok_username" class="username-input" />
        <button id="connectBtn" class="btn btn-connect">Kết nối Live</button>
        <button id="disconnectBtn" class="btn btn-disconnect hidden">Ngắt kết nối</button>
      </div>
      <div class="printer-status" id="printerStatus">
        <span>🖨️</span>
        <span id="printerText">Kiểm tra máy in...</span>
      </div>
    </div>
  </header>

  <!-- Stats bar -->
  <div class="stats-bar">
    <div class="stat-item">
      <span class="stat-number" id="statComments">0</span>
      <span class="stat-label">Bình luận</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <span class="stat-number" id="statOrders">0</span>
      <span class="stat-label">Đã chốt</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <span class="stat-number" id="statCustomers">0</span>
      <span class="stat-label">Khách hàng</span>
    </div>
  </div>

  <!-- Main layout -->
  <main class="main">
    <!-- Cột trái: Feed bình luận -->
    <section class="panel panel-feed">
      <div class="panel-header">
        <h2 class="panel-title">💬 Bình luận Live</h2>
        <div class="live-indicator" id="liveIndicator">
          <span class="live-dot"></span>
          <span>LIVE</span>
        </div>
      </div>
      <div class="comment-feed" id="commentFeed">
        <div class="empty-state" id="feedEmpty">
          <div class="empty-icon">📡</div>
          <p>Kết nối TikTok Live để nhận bình luận realtime</p>
        </div>
      </div>
    </section>

    <!-- Cột phải: Danh sách chốt đơn + Khách hàng -->
    <section class="panel panel-orders">
      <div class="tabs">
        <button class="tab active" data-tab="orders">📋 Đã chốt (<span id="orderCount">0</span>)</button>
        <button class="tab" data-tab="customers">👥 Khách hàng (<span id="customerCount">0</span>)</button>
      </div>

      <!-- Tab Đã chốt -->
      <div class="tab-content active" id="tab-orders">
        <div class="order-list" id="orderList">
          <div class="empty-state">
            <div class="empty-icon">🛒</div>
            <p>Chưa có đơn nào được chốt</p>
          </div>
        </div>
      </div>

      <!-- Tab Khách hàng -->
      <div class="tab-content" id="tab-customers">
        <div class="customer-list" id="customerList">
          <div class="empty-state">
            <div class="empty-icon">👥</div>
            <p>Chưa có khách hàng nào</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
